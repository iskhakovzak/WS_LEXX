kind = "web"
previewPath = "/"
title = "Edge Tracker"
version = "1.0.0"
id = "artifacts/edge-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24402

[services.development]
run = "pnpm --filter @workspace/edge-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edge-tracker", "run", "build" ]
publicDir = "artifacts/edge-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24402"
BASE_PATH = "/"

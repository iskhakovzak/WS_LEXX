<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="WS_Desk" />
    <meta name="apple-mobile-web-app-title" content="WS_Desk" />
    <title>WS_Desk</title>
    <meta name="description" content="WS_Desk — рабочее место трейдера и деска: сделки, статистика, риск и план дня." />
    <script>
      // Apply the saved theme and the «Вид» look (lib/appearance/apply.ts: ws_lexx_look) before first paint,
      // so a light-theme or customised user never sees a flash of the default dark look.
      try {
        var d = document.documentElement, c = d.classList, t = localStorage.getItem("ws_lexx_theme");
        if (t === "sepia") t = "light";
        if (t === "light" || t === "platinum") { c.remove("dark"); d.style.colorScheme = "light"; if (t === "platinum") c.add("platinum"); }
        else if (t === "dim") { c.add("dark", "dim"); }
        d.setAttribute("data-theme", t === "light" || t === "dim" || t === "platinum" ? t : "dark");
        var l = JSON.parse(localStorage.getItem("ws_lexx_look") || "null");
        if (l && l.theme === d.getAttribute("data-theme")) {
          for (var k in l.vars) if (k.indexOf("--") === 0) d.style.setProperty(k, String(l.vars[k]));
          for (var a in l.attrs) if (a.indexOf("data-") === 0) d.setAttribute(a, String(l.attrs[a]));
        }
      } catch (e) {}
    </script>
    <!-- Brand icons (mark «One line», components/ds/brand.tsx). ?v= busts the browsers' sticky favicon cache when the mark changes. -->
    <link rel="icon" href="/favicon.ico?v=line" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=line" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=line" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=line" />
    <link rel="manifest" href="/manifest.webmanifest?v=line" />
    <!-- Self-hosted Inter (src/fonts.css): only the two subsets every screen paints with are preloaded. -->
    <link rel="preload" href="/src/assets/fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/inter/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
